lblHexJournalArzakonWakes=Emrakul falls, but was only the gatekeeper. The ground splits and throws the party back: Arzakon, Shandalar’s Doom, steps through the gate at the centre of the map!
lblHexJournalArzakonWakesLate=The last dungeon is conquered, and Emrakul fell long ago: the ground at the centre of the map splits, and Arzakon, Shandalar’s Doom, steps through his gate!
lblHexJournalArzakonBeaten=Arzakon is beaten! Shandalar is free, and the party has seen the true end of the campaign.
lblHexJournalArzakonWithdraws=Arzakon laughs and withdraws through his gate. Emrakul’s fall still saves the land, for this cycle.
lblHexJournalArzakonLeft=The party steps back from Arzakon. He waits at his gate.
lblHexArzakonOneTry={0} awaits you. You get only one try against him in this cycle: if you lose, he withdraws and only returns in the next cycle.\n\nBring your strongest deck. You can still leave this field and prepare: the fight only begins when everybody presses Fight.
