# Hydra Adventure (hexcrawl): its own texts, kept apart from the main language file.
lblHexCampaign=Hydra Adventure
lblHexNoCampaign=No campaign yet.
lblHexIntro=Travel the hex map with your party, one field at a time. Every field has a colour. Enemies of that colour roam the fields in plain sight, with their life shown in a heart: step onto their field to fight them, or walk around them. After every fight and every visit to a town the enemies move on and new ones appear. Towns have shops, relics and tasks. Defeat the five archmages, then the last enemy in the centre.\n\nStart with "New".
