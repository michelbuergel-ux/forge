lblHexIntro=Reist mit eurer Gruppe Feld für Feld über die Hexkarte. Jedes Feld hat eine Farbe. Gegner dieser Farbe sind auf den Feldern zu sehen, ihr Leben steht im Herz: Betretet ihr Feld, um zu kämpfen, oder geht ihnen aus dem Weg. Nach jedem Kampf und jedem Stadtbesuch ziehen die Gegner weiter und neue tauchen auf. Städte bieten Läden, Relikte und Aufträge. Besiegt die fünf Großmagier und danach den letzten Gegner in der Mitte.\n\nBeginnt mit "Neu".
