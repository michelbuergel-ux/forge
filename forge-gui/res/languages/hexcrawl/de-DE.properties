lblHexJournalArzakonWakes=Emrakul fällt – doch er war nur der Torwächter. Die Erde reißt auf und wirft die Gruppe zurück: Arzakon, der Untergang Shandalars, tritt durch das Tor in der Mitte der Karte!
lblHexJournalArzakonWakesLate=Das letzte Verlies ist bezwungen, und Emrakul ist längst gefallen: Die Erde in der Mitte der Karte spaltet sich, und Arzakon, das Verhängnis Shandalars, tritt durch sein Tor!
lblHexJournalArzakonBeaten=Arzakon ist besiegt! Shandalar ist frei, und die Gruppe hat das wahre Ende der Kampagne gesehen.
lblHexJournalArzakonWithdraws=Arzakon lacht und zieht sich durch sein Tor zurück. Emrakuls Sturz rettet das Land trotzdem – für diesen Zyklus.
lblHexJournalArzakonLeft=Die Gruppe weicht vor Arzakon zurück. Er wartet an seinem Tor.
lblHexArzakonOneTry={0} erwartet euch. Gegen ihn habt ihr in diesem Zyklus nur einen Versuch: Verliert ihr, zieht er sich zurück und kommt erst im nächsten Zyklus wieder.\n\nNehmt euer stärkstes Deck mit. Noch könnt ihr dieses Feld verlassen und euch vorbereiten – der Kampf beginnt erst, wenn alle auf Kämpfen drücken.
lblHexArzakonIntro=Fünf Magier dienten mir, und fünf sind gefallen. Nun stellt euch dem, dem sie dienten.
lblHexArzakonInsult=Shandalar gehört mir. Kommt wieder, wenn ihr würdig seid.
lblHexArzakonEnding=Das wahre Ende: Arzakon ist besiegt, und kein Planeswalker bedroht Shandalar mehr.
lblHexArzakonHint=Der geheime Herr hinter den Erzmagiern. Ein Versuch je Zyklus: verliert die Gruppe, zieht er sich zurück.
